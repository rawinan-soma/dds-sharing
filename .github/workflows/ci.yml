name: CI

on:
  push:
  pull_request:

# No deployment here on purpose: deployment is `docker compose` on a single
# Docker host behind a ministry-managed edge that a runner cannot reach, and
# the domain re-probe (§17.1) is a human operator task, never a green build.
jobs:
  build-and-test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: dds_sharing
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/dds_sharing

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm run lint

      - run: pnpm run build

      - run: pnpm run test

      - run: pnpm --filter api run test:e2e

      - name: Apply migrations to a fresh database
        run: pnpm run db:migrate
