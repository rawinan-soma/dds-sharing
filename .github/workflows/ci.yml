name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: dds_sharing
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/dds_sharing
      APP_DATABASE_URL: postgres://app_role:app_role@localhost:5432/dds_sharing
      REDIS_URL: redis://localhost:6379
      # .env.test's MINIO_ACCESS_KEY/MINIO_SECRET_KEY are sentinels that
      # never authenticate against a real server — overridden here the same
      # way the two Postgres URLs above are, to match this job's real minio
      # service container.
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin
    steps:
      - uses: actions/checkout@v4

      # A plain `docker run`, not a `services:` entry: the GitHub Actions
      # services schema has no `command:` field, and the minio image's
      # default CMD is bare `minio` with no subcommand — it needs
      # `server /data` passed explicitly (docker-compose.yml does the
      # same), which only a `docker run` step can supply.
      - name: Start minio
        run: |
          docker run -d --name minio \
            -p 9000:9000 \
            -e MINIO_ROOT_USER=minioadmin \
            -e MINIO_ROOT_PASSWORD=minioadmin \
            quay.io/minio/minio:latest server /data
          for i in $(seq 1 30); do
            curl -sf http://localhost:9000/minio/health/live && break
            sleep 1
          done

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm run lint

      - name: Build web (the api's static-serving and SPA-fallback tests need a real build)
        run: pnpm --filter web build

      - name: Build api (also type-checks it)
        run: pnpm --filter api build

      - name: Unit tests
        run: pnpm -r test

      - name: API e2e tests
        run: pnpm --filter api run test:e2e

      - name: Repo-level tests (copy catalogue, §17.1)
        run: npx vitest run
