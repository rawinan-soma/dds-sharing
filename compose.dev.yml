# Development, on top of the production-shaped docker-compose.yml:
#   cp .env.example .env
#   docker compose -f docker-compose.yml -f compose.dev.yml up
#
# Adds Mailpit and the fake upstream, points the app at them, and turns on both
# insecure flags because the dev stack has no TLS. Nothing here is ever loaded
# by a plain `docker compose up`.
#
# `.env` is still needed: Compose interpolates each file on its own, so the base
# file's ${VAR:?} are checked before this file is merged in.
services:
  app:
    image: dds-sharing-dev
    # Bull Board on 3101, not the base file's 3100: the Pilot (ADR 0022) holds
    # 127.0.0.1:3100 when it runs on the same host.
    ports: !override
      - '3000:3000'
      - '127.0.0.1:3101:3100'
    # `docker compose logs` in development; the hour files are still written.
    logging:
      driver: json-file
    environment:
      TRUST_PROXY: 'false'
      FRONTEND_URL: http://localhost:3000
      ALLOW_INSECURE_TRANSPORT: 'true'
      SMTP_ALLOW_PLAINTEXT: 'true'
      SMTP_HOST: mailpit
      SMTP_PORT: 1025
      SMTP_STARTTLS: 'false'
      SMTP_SECURE: 'false'
      SMTP_USER: dev
      SMTP_PASS: dev
      SMTP_FROM: noreply@dds.localhost
      UPSTREAM_BASE_URL: http://fake-upstream:4010/api/d506/v1
      UPSTREAM_TOKEN: fake-upstream-token
    depends_on:
      mailpit:
        condition: service_started
      fake-upstream:
        condition: service_started

  fake-upstream:
    build: .
    image: dds-sharing-dev
    working_dir: /app/apps/api
    command: ['pnpm', 'run', 'fake-upstream']
    environment:
      FAKE_UPSTREAM_PORT: 4010

  # Loopback only: these hold the dev stack's change-me credentials, and the
  # host may be a server others can reach.
  mailpit:
    image: axllent/mailpit:latest
    ports:
      - '127.0.0.1:8025:8025'
      - '127.0.0.1:1025:1025'

  minio:
    ports:
      - '127.0.0.1:9000:9000'
      - '127.0.0.1:9001:9001'
