<!doctype html>
<!-- SURFACE 3 · "/link-expired" · spec §9.4
     ONE page, ONE sentence, plus the telephone number. Identical for all four
     failure states: expired token, exhausted attempts, deleted object, and a
     token that never existed.

     NO reference number. NO prefill. NO resubmit link. NO "try again".
     There is deliberately nothing else on this page — anything more would tell
     someone walking the token space which guesses landed.

     ⚠️ SERVING NOTE for the implementer, see ADR 0009 §"the one open question":
     §16.2 lists this as an Angular route, but §9.1 requires the collection path
     to survive the Angular bundle failing to load. This page therefore uses no
     Angular component and nothing but the shared CSS, so it can be served
     either way without the design changing. -->
