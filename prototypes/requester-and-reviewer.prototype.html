<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PROTOTYPE — Requester and Reviewer</title>
<!--
  PROTOTYPE — throwaway. Both surfaces of DDS Sharing, driven end to end in one
  page against one in-browser store: a Request submitted on the Requester form
  reaches the Reviewer queue, is decided, extracted, emailed and collected.

  Built from docs/design/system.md (locked 2026-09-30) and the copy on the
  Lunagraph page "Requester form: prototypes" in project dds-prototype. The dark
  strip at the top is prototype chrome, not part of the design: it switches
  surfaces and simulates what the server and the clock would do.

  Deliberate simplifications:
  - one clock, advanced by hand; the business-hours clock is treated as wall time
  - no real archive is served; a download only counts the Attempt
  - send-abandoned Alerts are not simulated
-->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@400;500;600;700&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --background: #e4e6ea;
    --card: #ffffff;
    --foreground: #1b1d24;
    --muted-foreground: #5f6470;
    --border: #dfe1e6;
    --input: #7a7e88;
    --primary: #3b5bfd;
    --primary-hover: #3050e8;
    --primary-wash: #eef1ff;
    --success: #1a7a4f;
    --success-wash: #e6f4ec;
    --pending: #8a5a00;
    --pending-wash: #fdf3dc;
    --pending-bright: #b7791f;
    --failed: #c42b3a;
    --failed-wash: #fbe9eb;
    --inert: #5f6470;
    --inert-wash: #eceef2;
    --sunk: #f7f8fa;
    --radius-sm: 6px;
    --radius-md: 10px;
    --radius-lg: 12px;
    --radius-xl: 20px;
    --shadow-card: 0 30px 60px rgb(0 0 0 / 0.06);
    --shadow-focus: 0 0 0 3px rgb(59 91 253 / 0.18);
    --shadow-float: 0 12px 32px rgb(0 0 0 / 0.18);
  }
  * { box-sizing: border-box; }
  html { font-family: "IBM Plex Sans Thai", "IBM Plex Sans", system-ui, sans-serif; }
  body {
    margin: 0;
    background: var(--background);
    color: var(--foreground);
    font-size: 15px;
    line-height: 1.65;
  }
  h1, h2, h3 { line-height: 1.35; margin: 0; font-weight: 600; }
  p { margin: 0; }
  ul { margin: 0; padding: 0; list-style: none; }
  button, input, select, textarea { font: inherit; color: inherit; }
  .figure, time, data { font-variant-numeric: tabular-nums; }
  :focus-visible { outline: 2px solid var(--primary); outline-offset: 2px; }
  [tabindex="-1"]:focus { outline: none; }
  .muted { color: var(--muted-foreground); }
  .sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { transition-duration: 0.01ms !important; animation-duration: 0.01ms !important; }
  }

  /* ───────── Prototype chrome (not the design) ───────── */
  .proto {
    position: sticky; top: 0; z-index: 50;
    background: #111318; color: #d6d8de;
    font: 13px/1.4 "IBM Plex Sans", system-ui, sans-serif;
    display: flex; align-items: center; gap: 6px; flex-wrap: wrap;
    padding: 8px 16px;
  }
  .proto b { color: #fff; font-weight: 600; margin-right: 10px; letter-spacing: 0.04em; }
  .proto .pbtn {
    background: transparent; color: #d6d8de; border: 1px solid #3a3e48;
    border-radius: 6px; padding: 4px 10px; cursor: pointer; font-size: 13px;
  }
  .proto .pbtn:hover { border-color: #8a8f9b; color: #fff; }
  .proto .pbtn[aria-current="page"] { background: #fff; color: #111318; border-color: #fff; }
  .proto .pbtn .count { background: var(--primary); color: #fff; border-radius: 9px; padding: 0 6px; margin-left: 4px; font-size: 11px; }
  .proto .spacer { flex: 1; }
  .proto .clock { font-variant-numeric: tabular-nums; color: #fff; }
  .sim {
    position: fixed; top: 44px; right: 12px; z-index: 60; width: 340px;
    max-height: calc(100vh - 60px); overflow: auto;
    background: #111318; color: #d6d8de; border-radius: 12px;
    font: 13px/1.45 "IBM Plex Sans", system-ui, sans-serif;
    padding: 14px 16px 16px; box-shadow: var(--shadow-float);
  }
  .sim h4 { margin: 12px 0 6px; font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase; color: #8a8f9b; font-weight: 600; }
  .sim h4:first-child { margin-top: 0; }
  .sim .row { display: flex; flex-wrap: wrap; gap: 6px; }
  .sim .pbtn { background: transparent; color: #d6d8de; border: 1px solid #3a3e48; border-radius: 6px; padding: 4px 9px; cursor: pointer; font-size: 12.5px; }
  .sim .pbtn:hover { border-color: #8a8f9b; color: #fff; }
  .sim .pbtn.on { background: #fdf3dc; color: #111318; border-color: #fdf3dc; }
  .sim .hint { color: #8a8f9b; font-size: 12px; margin-top: 4px; }
  .sim code { color: #fff; }
  .flash {
    position: fixed; right: 16px; bottom: 16px; z-index: 70; max-width: 360px;
    background: #111318; color: #fff; border-radius: 10px; padding: 10px 14px;
    font: 13px/1.45 "IBM Plex Sans", system-ui, sans-serif; box-shadow: var(--shadow-float);
  }
  .flash small { display: block; color: #8a8f9b; font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase; }

  /* ───────── Components ───────── */
  .card { background: var(--card); border-radius: var(--radius-xl); box-shadow: var(--shadow-card); padding: 24px; }
  .btn {
    display: inline-flex; align-items: center; justify-content: center; gap: 8px;
    height: 40px; padding: 0 20px; border-radius: var(--radius-md);
    border: 1px solid var(--input); background: var(--card); color: var(--foreground);
    cursor: pointer; font-size: 15px; transition: background-color .15s, border-color .15s, color .15s;
    white-space: nowrap; text-decoration: none;
  }
  .btn:hover { background: var(--primary-wash); }
  .btn:active { background: var(--primary-wash); border-color: var(--primary); }
  .btn.primary { background: var(--primary); border-color: var(--primary); color: #fff; font-weight: 600; }
  .btn.primary:hover, .btn.primary:active, .btn.primary[aria-busy="true"] { background: var(--primary-hover); border-color: var(--primary-hover); }
  .btn.quiet { color: var(--muted-foreground); }
  .btn.lg { height: 44px; padding: 0 32px; font-size: 16px; }
  .btn.full { width: 100%; }
  .btn:disabled, .btn[aria-disabled="true"] { opacity: 0.45; cursor: not-allowed; }
  .btn:disabled:hover, .btn[aria-disabled="true"]:hover { background: var(--card); }
  .btn.primary:disabled:hover { background: var(--primary); }
  .btn[aria-busy="true"] { cursor: progress; }
  .pair { display: grid; grid-template-columns: 1fr 1.2fr; gap: 12px; }
  .link { background: none; border: 0; padding: 0; color: var(--primary); cursor: pointer; text-decoration: underline; text-underline-offset: 2px; }
  .link.plain { text-decoration: none; }

  .lbl { display: flex; align-items: center; gap: 6px; font-size: 14px; font-weight: 500; margin-bottom: 6px; }
  .lbl .req { color: var(--primary); }
  .lbl .aside { margin-left: auto; font-size: 12px; font-weight: 400; color: var(--muted-foreground); }
  .lbl .aside.bad { color: var(--failed); font-weight: 600; }
  .lbl button.aside { background: none; border: 0; padding: 0; cursor: pointer; }
  .box {
    width: 100%; height: 44px; padding: 0 14px; border: 1px solid var(--input);
    border-radius: var(--radius-md); background: var(--card); font-size: 15px;
    transition: border-color .15s, box-shadow .15s;
  }
  .box::placeholder { color: #8a8e98; }
  .box:focus { outline: none; border-color: var(--primary); box-shadow: var(--shadow-focus); }
  .box.bad { border-color: var(--failed); }
  .box.code { letter-spacing: 0.3em; font-variant-numeric: tabular-nums; }
  select.box { appearance: none; background-image: linear-gradient(45deg, transparent 50%, var(--muted-foreground) 50%), linear-gradient(135deg, var(--muted-foreground) 50%, transparent 50%); background-position: calc(100% - 20px) 19px, calc(100% - 15px) 19px; background-size: 5px 5px; background-repeat: no-repeat; padding-right: 36px; }
  textarea.box { height: auto; min-height: 112px; padding: 10px 14px; resize: vertical; line-height: 1.6; }
  .field-err { color: var(--failed); font-size: 12px; margin-top: 4px; }
  .field-hint { color: var(--muted-foreground); font-size: 12px; margin-top: 4px; }
  .field { margin-top: 14px; }
  .field:first-child { margin-top: 0; }
  .pairrow { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .pairrow > .field { margin-top: 14px; }
  .divider { height: 1px; background: var(--border); margin: 20px 0 6px; }

  .tag { display: inline-flex; align-items: center; border-radius: var(--radius-sm); padding: 1px 8px; font-size: 12px; font-weight: 600; white-space: nowrap; }
  .tag.success { background: var(--success-wash); color: var(--success); }
  .tag.pending { background: var(--pending-wash); color: var(--pending); }
  .tag.failed { background: var(--failed-wash); color: var(--failed); }
  .tag.inert { background: var(--inert-wash); color: var(--inert); }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; }
  .chip { background: var(--card); border: 1px solid var(--border); border-radius: var(--radius-sm); padding: 1px 8px; font-size: 12px; }

  .statement { border-radius: 14px; padding: 20px; }
  .statement h3 { font-size: 16px; margin-bottom: 4px; }
  .statement p + p { margin-top: 4px; }
  .statement .note { font-size: 13px; color: var(--muted-foreground); }
  .statement.success { background: var(--success-wash); border: 1px solid var(--success); }
  .statement.success h3 { color: var(--success); }
  .statement.inert { background: var(--inert-wash); }
  .statement.pending { background: var(--pending-wash); }
  .statement.pending h3 { color: var(--pending); }
  .notice { border-radius: var(--radius-md); padding: 12px 14px; border-left: 2px solid; font-size: 14px; }
  .notice strong { display: block; font-weight: 600; }
  .notice .note { font-size: 12px; color: var(--muted-foreground); margin-top: 2px; }
  .notice.failed { background: var(--failed-wash); border-color: var(--failed); }
  .notice.failed strong { color: var(--failed); }
  .notice.pending { background: var(--pending-wash); border-color: var(--pending); }
  .notice.pending strong { color: var(--pending); }

  .mark { width: 48px; height: 48px; border-radius: 50%; display: grid; place-items: center; flex: none; font-weight: 700; font-size: 20px; }
  .mark.success { background: var(--success-wash); color: var(--success); }
  .mark.pending { background: var(--pending-wash); color: var(--pending); border: 1.5px solid var(--pending); }
  .mark.inert { background: var(--inert-wash); color: var(--inert); }
  .mark.solid-success { background: var(--success); color: #fff; }

  .kv { display: grid; grid-template-columns: 120px 1fr; gap: 12px; padding: 10px 0; border-top: 1px solid var(--border); font-size: 14px; }
  .kv:last-child { border-bottom: 1px solid var(--border); }
  .kv > dt { color: var(--muted-foreground); }
  .kv > dd { margin: 0; min-width: 0; overflow-wrap: anywhere; }
  dl { margin: 0; }

  /* Dialog */
  .scrim { position: fixed; inset: 0; background: rgb(27 29 36 / 0.45); z-index: 40; display: grid; place-items: center; padding: 24px; }
  .dialog { background: var(--card); border-radius: var(--radius-xl); padding: 32px; width: 520px; max-width: 100%; box-shadow: 0 30px 60px rgb(0 0 0 / 0.18); display: grid; gap: 20px; }
  .dialog.wide { width: 560px; }
  .dialog h2 { font-size: 18px; }
  .sunk-note { background: var(--sunk); border: 1px solid var(--border); border-radius: var(--radius-md); padding: 10px 12px; font-size: 13px; color: var(--muted-foreground); }

  /* Toast */
  .toast { position: fixed; left: 72px; bottom: 72px; z-index: 45; width: 400px; max-width: calc(100vw - 32px); background: var(--foreground); color: #fff; border-radius: 12px; padding: 16px 18px; box-shadow: var(--shadow-float); display: grid; gap: 6px; }
  .toast strong { font-size: 14px; }
  .toast p { font-size: 13px; color: #c9ccd3; line-height: 1.5; }
  .toast .btn { justify-self: start; margin-top: 6px; }

  /* ───────── Requester surface ───────── */
  .pub { max-width: 972px; margin: 0 auto; padding: 48px 56px 96px; }
  .pub-title { font-size: 28px; margin-bottom: 24px; }
  .deid h2 { font-size: 18px; margin-bottom: 14px; }
  .deid .cols { display: grid; grid-template-columns: 1fr 1fr; gap: 32px; border-top: 1px solid var(--border); padding-top: 14px; }
  .deid h3 { font-size: 14px; margin-bottom: 8px; }
  .deid .inc h3 { color: var(--success); }
  .deid .exc h3 { color: var(--muted-foreground); }
  .deid li { display: flex; gap: 10px; font-size: 14px; padding: 3px 0; }
  .dot { flex: none; width: 16px; height: 16px; border-radius: 50%; display: grid; place-items: center; font-size: 10px; font-weight: 700; margin-top: 4px; }
  .dot.ok { background: var(--success); color: #fff; }
  .dot.out { border: 1.5px solid var(--inert); color: var(--inert); }
  .dot.no { background: var(--inert); color: #fff; }
  .dot.bad { background: var(--failed); color: #fff; }

  .split { display: grid; grid-template-columns: 360px 460px; gap: 40px; align-items: start; margin-top: 32px; }
  .map-pane { position: sticky; top: 64px; display: grid; gap: 14px; justify-items: start; }
  .eyebrow { font-size: 12px; letter-spacing: 0.08em; color: var(--muted-foreground); }
  .area-head { font-size: 32px; font-weight: 600; line-height: 1.35; margin-top: -10px; }
  .area-head.none { color: var(--muted-foreground); }
  .segs { display: flex; gap: 8px; }
  .seg { border: 1px solid var(--input); background: var(--card); border-radius: var(--radius-sm); padding: 6px 14px; font-size: 14px; cursor: pointer; transition: background-color .15s, border-color .15s; }
  .seg:hover { background: var(--primary-wash); }
  .seg[aria-checked="true"] { background: var(--primary-wash); border-color: var(--primary); color: var(--primary); font-weight: 600; }
  .prov-field { width: 100%; }
  .map { display: grid; grid-template-columns: repeat(4, 72px); grid-template-rows: repeat(7, 56px); gap: 6px; }
  .cell {
    border: 1px solid var(--input); background: var(--card); border-radius: var(--radius-lg);
    font-size: 16px; font-weight: 600; color: var(--muted-foreground); cursor: pointer;
    transition: transform .1s, border-color .15s, color .15s, background-color .15s;
  }
  .cell:hover { transform: translateY(-2px); border-color: var(--primary); color: var(--primary); }
  .cell[aria-checked="true"] { background: var(--primary); border-color: var(--primary); color: #fff; }
  .cell.related { background: var(--primary-wash); border-color: var(--primary); color: var(--primary); }
  .map-caption { font-size: 12px; color: var(--muted-foreground); max-width: 360px; }

  .form-card { padding: 24px; }
  .form-head { display: flex; gap: 16px; align-items: center; padding-bottom: 20px; margin-bottom: 20px; border-bottom: 1px solid var(--border); }
  .badge { width: 48px; height: 48px; border-radius: 50%; border: 1px solid var(--border); display: grid; place-items: center; flex: none; }
  .form-head h2 { font-size: 18px; }
  .form-head p { font-size: 13px; color: var(--muted-foreground); }

  .tip-wrap { position: relative; display: inline-flex; }
  .tip-trigger { width: 16px; height: 16px; border-radius: 50%; background: var(--pending); color: #fff; border: 0; font-size: 10px; font-weight: 700; display: grid; place-items: center; cursor: help; padding: 0; }
  .tooltip {
    position: absolute; top: calc(100% + 10px); left: -20px; width: 320px; z-index: 5;
    background: var(--foreground); border-radius: var(--radius-md); padding: 12px 14px; box-shadow: var(--shadow-float);
    display: none; font-weight: 400;
  }
  .tooltip::before { content: ""; position: absolute; top: -5px; left: 23px; width: 10px; height: 10px; background: var(--foreground); transform: rotate(45deg); }
  .tooltip strong { display: block; color: #fff; font-size: 13px; font-weight: 600; }
  .tooltip span { display: block; color: #c9ccd3; font-size: 12px; line-height: 1.5; margin-top: 2px; }
  .tip-wrap.open .tooltip { display: block; }

  .datebox { position: relative; }
  .datebox .box { padding-right: 44px; }
  .cal-btn { position: absolute; right: 4px; top: 4px; width: 36px; height: 36px; border: 0; background: none; border-radius: 8px; color: var(--muted-foreground); cursor: pointer; display: grid; place-items: center; transition: background-color .15s, color .15s; }
  .cal-btn:hover, .cal-btn[aria-expanded="true"] { background: var(--primary-wash); color: var(--primary); }
  .cal { position: absolute; top: calc(100% + 6px); left: 0; z-index: 20; width: 304px; background: var(--card); border: 1px solid var(--border); border-radius: 14px; box-shadow: var(--shadow-float); padding: 12px; }
  .cal.right { left: auto; right: 0; }
  .cal-head { display: flex; gap: 6px; align-items: center; margin-bottom: 8px; }
  .cal-head select { height: 32px; border: 1px solid var(--input); border-radius: 8px; padding: 0 6px; font-size: 13px; background: var(--card); }
  .cal-head select:first-of-type { flex: 1; }
  .cal-nav { width: 32px; height: 32px; flex: none; border: 1px solid var(--input); border-radius: 8px; background: var(--card); cursor: pointer; font-size: 14px; }
  .cal-nav:hover { background: var(--primary-wash); }
  .cal-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 2px; text-align: center; }
  .cal-grid .wd { font-size: 11px; color: var(--muted-foreground); padding: 4px 0; }
  .cal-day { height: 36px; border: 0; background: none; border-radius: 8px; cursor: pointer; font-size: 13px; font-variant-numeric: tabular-nums; }
  .cal-day:hover { background: var(--primary-wash); }
  .cal-day.inrange { background: var(--primary-wash); border-radius: 0; }
  .cal-day.today { box-shadow: inset 0 0 0 1px var(--input); }
  .cal-day[aria-pressed="true"] { background: var(--primary); color: #fff; font-weight: 600; border-radius: 8px; }
  .cal-day:disabled { color: #b9bcc4; cursor: not-allowed; background: none; }
  .cal-foot { display: flex; justify-content: space-between; align-items: center; margin-top: 8px; padding-top: 8px; border-top: 1px solid var(--border); font-size: 12px; color: var(--muted-foreground); }
  .span-panel { grid-column: 1 / -1; display: flex; gap: 10px; background: var(--failed-wash); border-radius: var(--radius-md); padding: 12px 14px; margin-top: 10px; font-size: 13px; }
  .span-panel .dot { margin-top: 2px; }
  .span-panel strong { color: var(--failed); display: block; font-size: 14px; }

  .checklist { margin-top: 20px; border-radius: 14px; }
  .checklist.alarm { border: 2px solid var(--primary); box-shadow: var(--shadow-focus); padding: 14px; }
  .meter { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
  .meter span { height: 4px; border-radius: 2px; background: #e3e5ea; }
  .meter-label { font-size: 13px; color: var(--muted-foreground); margin-top: 6px; }
  .meter-label.ok { color: var(--success); font-weight: 600; }
  .alarm-head { color: var(--failed); font-weight: 600; font-size: 14px; margin-top: 8px; }
  .alarm-sub { font-size: 12px; color: var(--muted-foreground); }
  .checks { display: grid; gap: 4px; margin-top: 8px; font-size: 13px; color: var(--muted-foreground); }
  .checks li { display: flex; gap: 8px; align-items: flex-start; }
  .checks li .dot { margin-top: 2px; }
  .checks .jump { background: none; border: 0; padding: 0; color: var(--failed); font-weight: 600; text-decoration: underline; cursor: pointer; text-align: left; font-size: 13px; }
  .checks .failtext { color: var(--failed); font-weight: 600; }

  .consent { display: flex; gap: 12px; align-items: flex-start; margin-top: 16px; background: var(--sunk); border: 1px solid var(--border); border-radius: var(--radius-lg); padding: 14px; cursor: pointer; }
  .consent.on { background: var(--primary-wash); border-color: var(--primary); }
  .consent input { appearance: none; flex: none; width: 18px; height: 18px; border-radius: 50%; border: 1.5px solid var(--input); background: #fff; margin: 3px 0 0; display: grid; place-items: center; cursor: pointer; }
  .consent input:checked { background: var(--primary); border-color: var(--primary); }
  .consent input:checked::after { content: "✓"; color: #fff; font-size: 11px; font-weight: 700; }
  .consent strong { font-size: 14px; font-weight: 600; }
  .consent p { font-size: 13px; color: var(--muted-foreground); margin-top: 2px; }
  .form-actions { margin-top: 20px; }

  .narrow { max-width: 640px; margin: 0 auto; }
  .narrow .card { padding: 32px; display: grid; gap: 24px; }
  .narrow h1 { font-size: 26px; }
  .wash-panel { background: var(--primary-wash); border: 1px solid var(--primary); border-radius: 14px; padding: 18px 20px; }
  .wash-panel .big { font-size: 28px; font-weight: 600; overflow-wrap: anywhere; line-height: 1.35; }
  .wash-panel .huge { font-size: 40px; font-weight: 600; line-height: 1.25; }
  .wash-panel p.body { font-size: 14px; margin-top: 6px; }
  .section h2 { font-size: 16px; margin-bottom: 10px; }
  .tiles { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .tile { border: 1px solid var(--border); border-radius: 14px; padding: 14px 16px; font-size: 13px; }
  .tile strong { display: block; font-size: 14px; }
  .tile span { color: var(--muted-foreground); }
  .phone { font-size: 14px; color: var(--muted-foreground); }
  .phone b { color: var(--foreground); white-space: nowrap; }
  .head-row { display: flex; gap: 16px; align-items: center; }
  .head-row p { color: var(--muted-foreground); font-size: 14px; }
  .pending-panel { background: var(--pending-wash); border-radius: 14px; padding: 16px 18px; }
  .pending-panel p + p { margin-top: 4px; }
  .bordered { border: 1px solid var(--border); border-radius: 14px; padding: 16px 18px; display: grid; gap: 6px; justify-items: start; }

function finishRun(r, ok) {

  if (ok) {
    run.state = 'ready'; run.readyAt = S.now; run.deliveredAt = S.now;

function tick(minutes) {
  S.now += minutes * MIN;
  for (const r of reqs()) {
    if (r.state === 'pending') {
      r.bizMin -= minutes;
      if (r.bizMin <= 0) { r.bizMin = 0; r.state = 'lapsed'; log(r, 'ระบบ', 'ครบ 24 ชั่วโมงทำการโดยไม่มีการตัดสิน คำขอสิ้นสุด'); }
    }
    if (r.state !== 'approved') continue;
    for (const run of r.runs) {
      if (run.state !== 'ready') continue;
      if (linkMinLeft(run) <= 0) {
        run.state = 'expired';
        log(r, 'ระบบ', 'ลิงก์หมดอายุ', run.readyAt + LINK_HOURS * HOUR);
        if (run === curRun(r)) { r.state = 'ended'; r.alerts.forEach(a => { if (a.open) { a.open = false; a.outcome = 'ลิงก์หมดอายุ'; a.clearedBy = 'ระบบ'; a.clearedAt = S.now; } }); }

        r.alerts.push({ kind: 'lapse', raisedAt: S.now, assignee: r.decision.by, open: true });

  const reversed = f.from && f.to && isoDay(f.to) < isoDay(f.from);
  const n = f.from && f.to && !reversed ? days(f.from, f.to) : null;
  const tooLong = n != null && n > MAX_DAYS;
  const badFormat = badDate('from') || badDate('to');
  return { miss, reversed, n, tooLong, badFormat };
}
function checks(f) {
  const p = formProblems(f);
  return [
    { label: 'เลือกกลุ่มโรค 1 กลุ่ม', ok: !p.miss.has('groupId'), jump: 'f-group' },
    { label: 'ช่วงวันที่ไม่เกิน 365 วัน', ok: !p.miss.has('from') && !p.miss.has('to') && !p.reversed && !p.tooLong, jump: p.miss.has('from') ? 'f-from' : 'f-to', hard: p.reversed || p.tooLong || p.badFormat },

  ];
}

function refreshForm() {
  const f = S.form;
  if (!document.getElementById('req-form')) return;
  const p = formProblems(f);
  const shown = S.formUi.attempted;
  const errs = {
    name: 'กรุณากรอกข้อมูลในช่องนี้', surname: 'กรุณากรอกข้อมูลในช่องนี้', workplace: 'กรุณากรอกข้อมูลในช่องนี้',

  };
  for (const k of Object.keys(errs)) {
    const input = document.querySelector(`[data-field="${k}"]`);
    const on = shown && p.miss.has(k);
    input?.classList.toggle('bad', on);
    input?.setAttribute('aria-invalid', on);
    const slot = document.getElementById('err-' + k);
    if (slot) slot.innerHTML = on ? `<p class="field-err">${errs[k]}</p>` : '';
  }
  // Dates: one shared message for the pair.
  const dateBad = p.reversed || p.tooLong || (shown && (p.miss.has('from') || p.miss.has('to')));
  for (const k of ['from', 'to']) {
    const el = document.querySelector(`[data-date="${k}"]`);
    const on = badDate(k) || p.reversed || p.tooLong || (shown && p.miss.has(k));
    el.classList.toggle('bad', on);
    el.setAttribute('aria-invalid', on);
  }
  const aside = document.getElementById('days-aside');
  aside.textContent = p.n ? `${num(p.n)} วัน` : '';
  aside.classList.toggle('bad', !!p.tooLong);
  const panel = document.getElementById('date-panel');
  if (p.badFormat) panel.innerHTML = `<p class="field-err">อ่านวันที่ไม่ได้ พิมพ์เป็น วว/ดด/ปปปป ปี พ.ศ. เช่น 1/3/2569</p>`;
  else if (p.tooLong) panel.innerHTML = `<div class="span-panel" role="alert"><span class="dot bad" aria-hidden="true">!</span><div><strong>ช่วงวันที่ยาวเกินที่ขอได้</strong>API ของกรมควบคุมโรคจำกัดไว้ที่ 365 วันต่อหนึ่งคำขอ ระบบจะไม่ตัดช่วงวันให้เองเพราะจะทำให้ท่านไม่รู้ว่าได้ข้อมูลครบหรือไม่ กรุณาแยกส่งเป็นหลายคำขอ</div></div>`;
  else if (p.reversed) panel.innerHTML = `<div class="span-panel" role="alert"><span class="dot bad" aria-hidden="true">!</span><div><strong>วันสุดท้ายอยู่ก่อนวันแรก กรุณาตรวจสอบวันที่อีกครั้ง</strong></div></div>`;
  else panel.innerHTML = dateBad ? '<p class="field-err">กรุณากรอกวันที่ทั้งสองช่อง</p>' : '<p class="field-hint">ปี พ.ศ. เช่น 1/3/2569</p>';

  document.getElementById('email-clear').hidden = !f.email;
  document.getElementById('consent').classList.toggle('on', f.consent);

  const cs = checks(f);
  const score = cs.filter(c => c.ok).length;
  const lit = score === 5 ? 3 : score >= 3 ? 2 : score >= 1 ? 1 : 0;
  const color = score === 5 ? 'var(--success)' : score >= 3 ? 'var(--pending-bright)' : 'var(--failed)';
  const missingFields = [...p.miss].filter(k => !((k === 'from' || k === 'to') && badDate(k))).length + (p.reversed || p.tooLong || p.badFormat ? 1 : 0);
  const alarm = shown && score < 5;
  document.getElementById('checklist-slot').innerHTML = `
    <div class="checklist ${alarm ? 'alarm' : ''}" id="checklist" tabindex="-1" aria-live="polite">
      <div class="meter" aria-hidden="true">${[1, 2, 3].map(i => `<span style="${i <= lit ? `background:${color}` : ''}"></span>`).join('')}</div>
      ${alarm
        ? `<p class="alarm-head">ยังส่งคำขอไม่ได้ ขาดข้อมูล ${missingFields} รายการ</p><p class="alarm-sub">กดที่ชื่อรายการเพื่อไปยังช่องนั้น ข้อมูลที่กรอกไว้แล้วยังอยู่ครบ</p>`
        : `<p class="meter-label ${score === 5 ? 'ok' : ''}">${score === 5 ? 'พร้อมส่ง ครบทุกข้อ' : `คำขอยังไม่ครบ (${score}/5) ต้องมี:`}</p>`}
      <ul class="checks">${cs.map(c => {
        const failed = !c.ok && (alarm || c.hard);
        const mark = c.ok ? '<span class="dot ok" aria-hidden="true">✓</span>' : `<span class="dot ${failed ? 'bad' : 'no'}" aria-hidden="true">×</span>`;
        const txt = !c.ok && alarm ? `<button type="button" class="jump" data-act="jump" data-to="${c.jump}">${c.label}</button>` : failed ? `<span class="failtext">${c.label}</span>` : c.label;
        return `<li>${mark}<span><span class="sr-only">${c.ok ? 'ครบแล้ว: ' : 'ยังไม่ครบ: '}</span>${txt}</span></li>`;
      }).join('')}</ul>
    </div>`;
}

function tokenState(token) {
  for (const r of reqs()) for (const run of r.runs) if (run.token === token) {
    const ok = r.state === 'approved' && run.state === 'ready' && run.attempts < MAX_ATTEMPTS && linkMinLeft(run) > 0;
    return { r, run, ok };

  return { ok: false };
}

function takeSnapshot() {
  const z = { pending: [], alerts: [], inflight: [] };

}
const snapZone = k => (S.rv.snap?.[k] || []).map(ref => S.requests[ref]).filter(Boolean);
function moveInSnap(ref, to) {
  for (const k of ['pending', 'alerts', 'inflight']) S.rv.snap[k] = S.rv.snap[k].filter(x => x !== ref);
  if (to) { S.rv.snap[to].push(ref); S.rv.snap[to].sort((a, b) => S.requests[a].submittedAt - S.requests[b].submittedAt); }
}

function renderReviewer() {
  const rv = S.rv;
  document.title = 'ผู้ตรวจสอบ · DDS Sharing';
  const narrow = `<section class="card narrow-screen"><p class="eyebrow2">DDS Sharing · ผู้ตรวจสอบ</p><h1>ใช้หน้านี้บนจอที่กว้างกว่านี้</h1><p>การตัดสินต้องเห็นข้อมูลผู้ขอและสิ่งที่ขอครบก่อนถึงปุ่มอนุมัติ จึงเปิดได้เฉพาะบนจอกว้างตั้งแต่ 1024 พิกเซลขึ้นไป</p></section>`;
  if (!rv.user) return `<div class="rv-wrap">${renderSignIn()}${narrow}</div>`;
  if (!rv.snap) takeSnapshot();
  return `<div class="rv-wrap"><div class="rv">
    <header class="rv-header"><p class="brand">DDS Sharing<span>ผู้ตรวจสอบ</span></p><p class="who"><span>${esc(rv.user)}</span><button class="link plain" data-act="sign-out">ออกจากระบบ</button></p></header>
    ${renderBand()}
    ${renderDossier()}
  </div>${narrow}</div>`;
}

function renderSignIn() {
  const n = S.rv.notice;
  return `<form class="card signin" id="signin" novalidate>
    <p class="eyebrow2">DDS Sharing · ผู้ตรวจสอบ</p>
    <h1>เข้าสู่ระบบ</h1>
    ${signInFailed ? `<div class="notice failed" role="alert"><strong>เข้าสู่ระบบไม่สำเร็จ</strong>ชื่อผู้ใช้ รหัสผ่าน หรือรหัส 6 หลัก มีอย่างน้อยหนึ่งอย่างไม่ถูกต้อง<p class="note">บัญชีไม่ถูกล็อก ถ้าลองผิดหลายครั้ง ระบบจะให้รอนานขึ้นก่อนลองใหม่</p></div>` : ''}
    ${!signInFailed && n ? `<div class="notice pending" role="alert"><strong>ออกจากระบบแล้ว การอนุมัติที่กดล่าสุดไม่ถูกบันทึก</strong>เซสชันหมดก่อนที่การกดจะถึงระบบ คำขอ ${esc(n.ref)} ยังรอตัดสินอยู่<p class="note">เข้าสู่ระบบแล้วจะกลับไปที่คำขอนั้น ถ้ายังต้องการอนุมัติ ให้กดอีกครั้ง</p></div>` : ''}
    <div>
      <div class="field"><label class="lbl" for="si-user">ชื่อผู้ใช้</label><input id="si-user" class="box" autocomplete="username" value="${esc(S.rv.lastUser || '')}" ${signingIn ? 'readonly' : ''}></div>
      <div class="field"><label class="lbl" for="si-pass">รหัสผ่าน</label><input id="si-pass" type="password" class="box" autocomplete="current-password" ${signInFailed ? 'placeholder="พิมพ์รหัสผ่านอีกครั้ง"' : ''} ${signingIn ? 'readonly' : ''}></div>
      <div class="field"><label class="lbl" for="si-code">รหัส 6 หลักจากแอปยืนยันตัวตน</label><input id="si-code" class="box code" inputmode="numeric" autocomplete="one-time-code" maxlength="6" ${signInFailed ? 'placeholder="รหัสใหม่จากแอป"' : ''} aria-describedby="si-code-h" ${signingIn ? 'readonly' : ''}><p class="field-hint" id="si-code-h">รหัสเปลี่ยนทุก 30 วินาที</p></div>
    </div>
    <button type="submit" class="btn lg primary full" ${signingIn ? 'aria-busy="true"' : ''}>${signingIn ? 'กำลังเข้าสู่ระบบ…' : 'เข้าสู่ระบบ'}</button>
    <p class="foot">บัญชีสร้างโดยผู้ดูแลระบบเท่านั้น ไม่มีการรีเซ็ตรหัสผ่านทางอีเมล ถ้าเข้าไม่ได้ ให้ติดต่อผู้ตรวจสอบอีกท่าน</p>
  </form>`;
}

function staleText() {
  const mins = Math.floor((S.now - S.rv.snap.at) / MIN);
  return mins < 1 ? 'อัปเดตเมื่อสักครู่' : mins < 60 ? `อัปเดตเมื่อ ${mins} นาทีที่แล้ว` : `อัปเดตเมื่อ ${Math.floor(mins / 60)} ชั่วโมงที่แล้ว`;
}

function renderBand() {
  const rv = S.rv;
  const zp = snapZone('pending'), za = snapZone('alerts'), zi = snapZone('inflight');
  const tab = (k, label, n, attn) => `<button role="tab" id="tab-${k}" class="tab ${attn ? 'attn' : ''} ${attn && k !== rv.zone ? 'strong' : ''}" aria-selected="${rv.zone === k}" aria-controls="zone-panel" tabindex="${rv.zone === k ? 0 : -1}" data-act="zone" data-zone="${k}">${label} · ${n}</button>`;
  const stale = rv.refreshErr
    ? `<p class="stale bad" aria-live="polite">โหลดรายการไม่สำเร็จ · รายการด้านล่างเป็นของเมื่อ ${Math.max(1, Math.floor((S.now - rv.snap.at) / MIN))} นาทีที่แล้ว</p>`
    : `<p class="stale" aria-live="polite">${staleText()}. รายการนี้ไม่รีเฟรชเอง</p>`;
  return `<div class="band">
    <div class="band-row">
      <div class="tabs" role="tablist" aria-label="คิว">
        ${tab('pending', 'รอตัดสิน', zp.length)}${tab('alerts', 'ต้องจัดการ', za.length, za.length > 0)}${tab('inflight', 'กำลังดำเนินการ', zi.length)}
      </div>
      <div class="band-right">
        ${stale}
        <form class="lookup" id="lookup" role="search"><label class="sr-only" for="lk">ค้นหาด้วยเลขที่คำขอ</label><input id="lk" class="box figure" placeholder="ค้นหาด้วยเลขที่คำขอ" value="${esc(rv.lookupQ)}" autocomplete="off">${rv.lookupErr ? `<p class="lk-err" role="alert">${esc(rv.lookupErr)}</p>` : ''}</form>
        <button class="btn" data-act="refresh">${rv.refreshErr ? '↻ ลองอีกครั้ง' : '↻ รีเฟรช'}</button>
      </div>
    </div>
    <div id="zone-panel" role="tabpanel" aria-labelledby="tab-${rv.zone}">${renderZoneTable(zp, za, zi)}</div>
  </div>`;
}

function renderZoneTable(zp, za, zi) {
  const rv = S.rv;
  const selRef = rv.lookup ? null : rv.sel;
  if (rv.zone === 'pending') {
    if (!zp.length) {
      if (za.length) return `<div class="empty"><span class="mark pending" aria-hidden="true">!</span><h2>ไม่มีคำขอรอตัดสิน แต่งานยังไม่หมด</h2><p>มีเรื่องต้องจัดการ ${za.length} เรื่อง ผู้ขอกำลังรอคนติดต่อกลับ</p><button class="btn" data-act="zone" data-zone="alerts">ไปที่ต้องจัดการ</button></div>`;
      return `<div class="empty"><span class="mark success" aria-hidden="true">✓</span><h2>ไม่มีคำขอรอตัดสิน</h2><p>และไม่มีเรื่องต้องจัดการ คำขอใหม่จะแจ้งทางอีเมล</p><p class="small">หน้านี้ไม่อัปเดตเอง กดรีเฟรชเมื่อได้รับอีเมล</p></div>`;
    }
    return `<table class="qtable"><colgroup><col style="width:220px"><col><col style="width:260px"><col style="width:150px"><col style="width:140px"></colgroup>
      <thead><tr><th scope="col">ผู้ขอ</th><th scope="col">หน่วยงาน</th><th scope="col">กลุ่มโรค</th><th scope="col">ส่งเมื่อ</th><th scope="col">เวลาที่เหลือ</th></tr></thead>
      <tbody>${zp.map(r => `<tr class="${r.ref === selRef ? 'sel' : ''}" data-act="select" data-ref="${r.ref}"><th scope="row"><button class="rowbtn" data-act="select" data-ref="${r.ref}" aria-current="${r.ref === selRef}">${esc(fullName(r))}</button></th><td>${esc(r.workplace)}</td><td>${esc(groupById(r.groupId).name)}</td><td class="muted figure">${esc(dmHm(r.submittedAt))}</td><td class="figure">${rv.decided[r.ref] === 'expired' ? 'หมดเวลา' : durHM(r.bizMin)}</td></tr>`).join('')}</tbody></table>`;
  }
  if (rv.zone === 'alerts') {
    if (!za.length) return `<div class="empty"><span class="mark success" aria-hidden="true">✓</span><h2>ไม่มีเรื่องต้องจัดการ</h2><p>เรื่องใหม่จะแจ้งทางอีเมล</p></div>`;
    return `<table class="qtable"><colgroup><col style="width:200px"><col style="width:160px"><col><col style="width:180px"><col style="width:150px"></colgroup>
      <thead><tr><th scope="col">เรื่อง</th><th scope="col">คำขอ</th><th scope="col">ผู้ขอ</th><th scope="col">มอบหมายให้</th><th scope="col">เกิดขึ้นเมื่อ</th></tr></thead>
      <tbody>${za.map(r => { const a = openAlerts(r)[0] || r.alerts[r.alerts.length - 1]; return `<tr class="alert ${r.ref === selRef ? 'sel' : ''}" data-act="select" data-ref="${r.ref}"><th scope="row"><button class="rowbtn kind" data-act="select" data-ref="${r.ref}">${alertTitle(a)}</button></th><td class="figure">${r.ref}</td><td>${esc(fullName(r))} · ${esc(r.workplace.split(' ').slice(0, 2).join(' '))}</td><td>${esc(a.assignee)}</td><td class="muted figure">${esc(dmHm(a.raisedAt))}</td></tr>`; }).join('')}</tbody></table>`;
  }
  const hidden = za.length;
  if (!zi.length) return `<div class="empty"><span class="mark inert" aria-hidden="true">–</span><h2>ไม่มีคำขอที่กำลังดำเนินการ</h2></div>`;
  return `<p class="band-note" style="margin-bottom:10px">เรียงตามเวลาที่ส่งคำขอ คำขอที่มีเรื่องต้องจัดการแสดงที่แท็บต้องจัดการแทน ไม่แสดงซ้ำที่นี่ (${hidden} รายการ)</p>
    <table class="qtable"><colgroup><col style="width:170px"><col><col style="width:170px"><col style="width:160px"><col style="width:300px"></colgroup>
    <thead><tr><th scope="col">คำขอ</th><th scope="col">ผู้ขอ</th><th scope="col">อนุมัติโดย</th><th scope="col">สถานะ</th><th scope="col">ลิงก์ดาวน์โหลด</th></tr></thead>
    <tbody>${zi.map(r => { const run = curRun(r); return `<tr class="${r.ref === selRef ? 'sel' : ''}" data-act="select" data-ref="${r.ref}"><th scope="row"><button class="rowbtn figure" data-act="select" data-ref="${r.ref}">${r.ref}</button></th><td>${esc(fullName(r))} · ${esc(r.workplace.split(' ').slice(0, 2).join(' '))}</td><td>${esc(r.decision?.by || '')}</td><td>${runTag(r)}</td><td class="figure ${run?.state === 'ready' ? '' : 'muted'}">${linkCell(r)}</td></tr>`; }).join('')}</tbody></table>`;
}
function runTag(r) {
  const s = curRun(r)?.state;
  if (r.state !== 'approved') return '<span class="tag inert">สิ้นสุดแล้ว</span>';
  return { ready: '<span class="tag success">ไฟล์พร้อมแล้ว</span>', running: '<span class="tag inert">กำลังดึงข้อมูล</span>', queued: '<span class="tag inert">รอคิวดึงข้อมูล</span>', failed: '<span class="tag failed">ดึงข้อมูลไม่สำเร็จ</span>' }[s] || '';
}
function linkCell(r) {
  const run = curRun(r);
  if (r.state !== 'approved') return 'สิ้นสุดแล้ว';
  if (run.state === 'ready') return `เหลือ ${Math.floor(linkMinLeft(run) / 60)} ชม. · ดาวน์โหลด ${run.attempts} จาก ${MAX_ATTEMPTS}`;
  if (run.state === 'failed') return 'ดึงข้อมูลไม่สำเร็จ';
  return 'ยังทำอะไรไม่ได้จนกว่าจะดึงข้อมูลเสร็จ';
}
const alertTitle = a => ({ failed: 'ดึงข้อมูลไม่สำเร็จ', lapse: 'ยังไม่มีการดาวน์โหลด' }[a.kind]);

function renderDossier() {
  const rv = S.rv;
  if (rv.lookup) return renderLookup(S.requests[rv.lookup]);
  const list = snapZone(rv.zone);
  let r = S.requests[rv.sel];
  if (!r || (!list.includes(r) && !rv.decided[r.ref])) { r = list[0]; rv.sel = r?.ref || null; }
  if (!r) return '';
  if (rv.zone === 'pending') return renderPendingDossier(r);
  if (rv.zone === 'alerts') return renderAlertDossier(r);
  return renderInflightDossier(r);
}

function contactCol(r, title = 'ผู้ขอข้อมูล', split = true) {
  return `<section aria-labelledby="c-h"><h3 id="c-h">${title}</h3><dl>
    ${split ? `<div class="kv"><dt>ชื่อ</dt><dd>${esc(r.name)}</dd></div><div class="kv"><dt>นามสกุล</dt><dd>${esc(r.surname)}</dd></div>` : `<div class="kv"><dt>ชื่อ นามสกุล</dt><dd>${esc(fullName(r))}</dd></div>`}
    <div class="kv"><dt>หน่วยงาน</dt><dd>${esc(r.workplace)}</dd></div>
    <div class="kv"><dt>โทรศัพท์</dt><dd class="figure">${esc(r.tel)}</dd></div>
    <div class="kv"><dt>อีเมล</dt><dd>${esc(r.email)}</dd></div>
  </dl></section>`;
}
function askCol(r, { rows = true, workplace = false } = {}) {
  const open = S.rv.codesOpen[r.ref];
  return `<section aria-labelledby="a-h"><h3 id="a-h">สิ่งที่ขอ</h3><dl>
    <div class="kv"><dt>กลุ่มโรค</dt><dd>${esc(groupById(r.groupId).name)}
      <button class="codes-btn" data-act="codes" data-ref="${r.ref}" aria-expanded="${!!open}">${open ? '▾' : '▸'} รหัสรายงาน ${r.codes.length} รหัส</button>
      ${open ? `<p class="codes-list figure">${r.codes.join(' · ')}</p>` : ''}</dd></div>
    <div class="kv"><dt>ช่วงวันที่</dt><dd class="figure">${esc(rangeShort(r))} · ${num(days(r.from, r.to))} วัน</dd></div>
    <div class="kv"><dt>พื้นที่</dt><dd>${esc(areaLabel(r, true))}</dd></div>
    ${workplace ? `<div class="kv"><dt>หน่วยงาน</dt><dd>${esc(r.workplace)}</dd></div>` : ''}
    ${rows ? `<div class="kv"><dt>จำนวนแถว</dt><dd class="figure">${rowsText(r)}</dd></div>` : ''}
  </dl></section>`;
}
const meta = cells => `<div class="dos-meta">${cells.map(([k, v, cls]) => `<div><small>${k}</small><span class="${cls || ''}">${v}</span></div>`).join('')}</div>`;

function renderPendingDossier(r) {
  const rv = S.rv;
  const decided = rv.decided[r.ref];
  const ahead = snapZone('pending').filter(x => x.submittedAt < r.submittedAt).length;
  let foot;
  if (decided === 'approved') foot = `<div class="after"><div class="statement success" role="status"><h3>อนุมัติแล้ว โดยท่าน เวลา ${hm(r.decision.at)}</h3><p>ระบบเริ่มดึงข้อมูลแล้ว ผู้ขอจะได้รับอีเมลเมื่อไฟล์พร้อม ชื่อของท่านอยู่บนการปล่อยข้อมูลนี้ถาวร</p><p class="note">ติดตามคำขอนี้ได้ที่แท็บ <button class="link plain" data-act="zone" data-zone="inflight" data-sel="${r.ref}">กำลังดำเนินการ</button></p></div></div>`;
  else if (decided === 'rejected') foot = `<div class="after"><div class="statement inert" role="status"><h3>ไม่อนุมัติแล้ว โดยท่าน เวลา ${hm(r.decision.at)}</h3><p>ส่งอีเมลแจ้งผู้ขอแล้วว่าไม่ได้รับอนุมัติ โดยไม่ได้บอกเหตุผล บันทึกภายในของท่านเก็บไว้ในบันทึกของระบบ</p><p class="note">คำขอนี้สิ้นสุดแล้ว และจะไม่ปรากฏบนหน้านี้อีก</p></div></div>`;
  else if (decided === 'expired') foot = `<div class="after"><div class="statement pending" role="status"><h3>คำขอนี้หมดเวลาระหว่างที่ท่านอ่าน</h3><p>คำขอครบ 24 ชั่วโมงทำการก่อนที่การตัดสินของท่านจะถึงระบบ จึงไม่ได้บันทึกการอนุมัติ</p></div></div>`;
  else if (decided === 'taken') foot = `<div class="after"><div class="statement inert" role="status"><h3>คำขอนี้ตัดสินไปแล้วโดย ${esc(r.decision.by)} เวลา ${hm(r.decision.at)}</h3><p>การกดของท่านไม่ได้ถูกบันทึก กดรีเฟรชเพื่อดูรายการล่าสุด</p></div></div>`;
  else foot = `<div class="strip">
      <div class="q"><p>บุคคลนี้มีตัวตนอยู่จริงวันนี้ และทำงานที่หน่วยงานที่ระบุหรือไม่?</p><small>ถ้าไม่แน่ใจ โทรหาผู้ขอก่อนตัดสิน. การอนุมัติย้อนกลับไม่ได้</small></div>
      <div class="btns"><button class="btn lg" style="width:180px" data-act="open-reject" data-ref="${r.ref}">ไม่อนุมัติ</button><button class="btn lg primary" style="width:260px" data-act="open-approve" data-ref="${r.ref}">อนุมัติและปล่อยข้อมูล</button></div>
    </div>`;
  const expiredShown = decided === 'expired';
  return `<article class="dossier" aria-labelledby="dos-name">
    <div class="dos-head">
      <div><p class="ref figure">คำขอ ${r.ref}</p><h2 id="dos-name" tabindex="-1">${esc(fullName(r))}</h2></div>
      ${meta([['ส่งเมื่อ', dtShort(r.submittedAt)], ['เวลาทำการที่เหลือ', expiredShown ? '0 ชม. 00 น.' : decided ? '—' : durHM(r.bizMin)], ['ก่อนหน้า', `${ahead} คำขอ`]])}
    </div>
    <div class="cols2">${contactCol(r)}${askCol(r)}</div>
    ${foot}
  </article>`;
}

function outcomeButtons(r, a) {
  const mine = a.assignee === S.rv.user;
  const outs = a.kind === 'failed' ? ['ติดต่อผู้ขอแล้ว', 'ยุติเรื่อง'] : ['ติดต่อผู้ขอได้แล้ว', 'ติดต่อไม่ได้', 'ไม่ต้องทำอะไรเพิ่ม'];
  return `<p class="sub">ปิดเรื่องนี้ด้วยผลที่เกิดขึ้น</p>
    <div class="outs">${outs.map(o => `<button class="btn" data-act="outcome" data-ref="${r.ref}" data-out="${o}" ${mine ? '' : 'aria-disabled="true" aria-describedby="why-out"'}>${o}</button>`).join('')}</div>
    ${mine ? '' : `<small id="why-out">เรื่องนี้มอบหมายให้ ${esc(a.assignee)} โดยชื่อ เพราะเป็นผู้ที่รับรองผู้ขอรายนี้ จึงปิดได้เฉพาะ ${esc(a.assignee)}</small>`}
    <small>ไม่มีช่องให้พิมพ์ จำนวนครั้งของแต่ละผลคือตัวเลขเดียวที่บอกว่าปัญหานี้เกิดบ่อยแค่ไหน</small>`;
}

function renderAlertDossier(r) {
  const a = openAlerts(r)[0];
  if (!a) return renderInflightDossier(r);
  const run = curRun(r);
  const rerunning = a.kind === 'failed' && ['queued', 'running'].includes(run.state);
  const body = a.kind === 'failed'
    ? `<p>ระบบลองดึงข้อมูลครบทุกครั้งแล้วแต่ไม่ได้ไฟล์ ผู้ขอยังไม่ได้รับอะไรเลย และไม่รู้ว่าเกิดปัญหา ผู้ดูแลระบบได้รับแจ้งเรื่องความผิดพลาดแยกต่างหากแล้ว</p>`
    : `<p>ส่งลิงก์ไปที่ ${esc(r.email)} เมื่อ ${esc(dtShort(run.deliveredAt))} ผ่านมา 24 ชั่วโมงแล้วยังไม่มีการดาวน์โหลด ระบบมองไม่เห็นว่าอีเมลถึงผู้ขอหรือไม่ ความเงียบนี้เป็นสัญญาณเดียวที่มี</p>`;

    <h3>${alertTitle(a)}</h3>${body}
    <div class="alert-contact" aria-label="ติดต่อผู้ขอ">
      <div><small>ผู้ขอ</small><b>${esc(fullName(r))}</b><span>${esc(r.workplace)}</span></div>
      <div><small>โทรศัพท์</small><b class="tel figure">${esc(r.tel)}</b></div>
      <div><small>อีเมล</small><span class="addr">${esc(r.email)}</span></div>
    </div>
    <p class="meta">มอบหมายให้ ${esc(a.assignee)}${a.assignee === S.rv.user ? ' เพราะท่านเป็นผู้อนุมัติ' : ' ผู้อนุมัติคำขอนี้'} · เกิดขึ้นเมื่อ ${esc(dtShort(a.raisedAt))}${a.attempts > 1 ? ` · ดึงข้อมูลไม่สำเร็จ ${a.attempts} ครั้ง` : ''}</p>

  </div>`;
  const headMeta = a.kind === 'failed'
    ? [['อนุมัติโดย', esc(r.decision.by)], ['อนุมัติเมื่อ', dtShort(r.decision.at)], ['ดึงข้อมูล', `ครั้งที่ ${run.n} จาก ${run.n}`]]
    : [['อนุมัติโดย', esc(r.decision.by)], ['ส่งลิงก์เมื่อ', dtShort(run.deliveredAt)], ['ลิงก์เหลือ', durHM(linkMinLeft(run)), 'success'], ['ดาวน์โหลดแล้ว', `${run.attempts} จาก ${MAX_ATTEMPTS} ครั้ง`]];
  const tail = a.kind === 'failed'
    ? `<div class="rerun"><div><p>ดึงข้อมูลใหม่จากคำขอเดิม</p><small>ไม่ต้องตัดสินใหม่ ถ้าครั้งใหม่สำเร็จ ระบบส่งไฟล์ให้ผู้ขอและปิดเรื่องนี้เอง ถ้าไม่สำเร็จ เรื่องนี้ยังอยู่ที่นี่</small></div>
        <div style="display:grid;justify-items:end;gap:4px"><button class="btn lg" data-act="rerun" data-ref="${r.ref}" ${rerunning ? 'aria-disabled="true" aria-describedby="why-rr"' : ''}>${rerunning ? 'กำลังดึงข้อมูลใหม่…' : 'ดึงข้อมูลใหม่'}</button>${rerunning ? '<small id="why-rr">ยังทำอะไรไม่ได้จนกว่าจะดึงข้อมูลเสร็จ</small>' : ''}</div></div>`

function actionPair(r) {
  const run = curRun(r);
  const busy = ['queued', 'running'].includes(run.state);
  const canResend = run.state === 'ready';
  const why = busy ? 'ยังทำอะไรไม่ได้จนกว่าจะดึงข้อมูลเสร็จ' : run.state === 'failed' ? 'ไม่มีไฟล์ให้ส่ง ดึงข้อมูลครั้งล่าสุดไม่สำเร็จ' : '';
  const note = S.rv.actionNote?.[r.ref];
  return `<div class="actions2">
    <div><strong>ส่งอีเมลซ้ำ</strong><p>ส่งลิงก์เดิมไปที่ ${esc(r.email)} อีกครั้ง ลิงก์ไม่ได้ต่ออายุ</p>
      <button class="btn" data-act="resend" data-ref="${r.ref}" ${canResend ? '' : 'aria-disabled="true" aria-describedby="why-rs"'}>ส่งอีเมลซ้ำ</button>

    <div><strong>ดึงข้อมูลใหม่</strong><p>ทำไฟล์ใหม่จากคำขอเดิม ได้ลิงก์ใหม่ 72 ชั่วโมง ลิงก์เดิมยังใช้ได้จนกว่าไฟล์ใหม่จะพร้อม</p>
      <button class="btn" data-act="rerun" data-ref="${r.ref}" ${busy ? 'aria-disabled="true" aria-describedby="why-rr"' : ''}>ดึงข้อมูลใหม่</button>

const absence = () => `<div class="absence"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><rect x="5" y="11" width="14" height="9" rx="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/></svg><div><strong>แก้ที่อยู่อีเมลของผู้ขอไม่ได้</strong>ผู้ตรวจสอบตัดสินว่าใครได้ข้อมูล ไม่ใช่ข้อมูลไปที่ไหน ถ้าอีเมลผิด ผู้ขอต้องส่งคำขอใหม่ด้วยอีเมลที่ถูกต้อง</div></div>`;

function renderInflightDossier(r) {
  const run = curRun(r);
  if (isTerminal(r)) return renderLookup(r);
  const ready = run.state === 'ready';
  const readyRun = [...r.runs].reverse().find(x => x.state === 'ready');
  const m = [['อนุมัติโดย', esc(r.decision.by)]];
  if (ready) m.push(['ไฟล์พร้อมเมื่อ', dtShort(run.readyAt)], ['ลิงก์เหลือ', durHM(linkMinLeft(run)), 'success'], ['ดาวน์โหลดแล้ว', `${run.attempts} จาก ${MAX_ATTEMPTS} ครั้ง`]);
  else if (readyRun) m.push(['สถานะ', `กำลังดึงข้อมูลใหม่ ครั้งที่ ${run.n}`], ['ลิงก์เดิมเหลือ', durHM(linkMinLeft(readyRun)), 'success']);
  else m.push(['อนุมัติเมื่อ', dtShort(r.decision.at)], ['สถานะ', { queued: 'รอคิวดึงข้อมูล', running: 'กำลังดึงข้อมูล', failed: 'ดึงข้อมูลไม่สำเร็จ' }[run.state]]);
  return `<article class="dossier" aria-labelledby="dos-name">
    <div class="dos-head"><div><p class="ref figure">คำขอ ${r.ref}</p><h2 id="dos-name" tabindex="-1">${esc(fullName(r))}</h2></div>${meta(m)}</div>

  </article>`;
}

}

/* ═════════════════ Date picker (พ.ศ.) ═════════════════ */

const TH_MONTHS_LONG = ['มกราคม', 'กุมภาพันธ์', 'มีนาคม', 'เมษายน', 'พฤษภาคม', 'มิถุนายน', 'กรกฎาคม', 'สิงหาคม', 'กันยายน', 'ตุลาคม', 'พฤศจิกายน', 'ธันวาคม'];
const TH_WEEKDAYS = ['อา', 'จ', 'อ', 'พ', 'พฤ', 'ศ', 'ส'];
const isoOf = ms => new Intl.DateTimeFormat('en-CA', { timeZone: TZ, year: 'numeric', month: '2-digit', day: '2-digit' }).format(ms);
const addDays = (iso, n) => new Date(Date.parse(iso + 'T00:00:00Z') + n * DAY).toISOString().slice(0, 10);
let picker = null; // { k, y, m }

// The other end of the range bounds this one, so the picker can only offer a span of at most 365 days.
function pickerLimits(k) {
  const f = S.form;
  if (k === 'to' && f.from) return { lo: f.from, hi: addDays(f.from, MAX_DAYS - 1) };
  if (k === 'from' && f.to) return { lo: addDays(f.to, -(MAX_DAYS - 1)), hi: f.to };
  return { lo: '0000-01-01', hi: '9999-12-31' };
}
function openPicker(k) {
  const base = S.form[k] || (k === 'to' && S.form.from) || (k === 'from' && S.form.to) || isoOf(S.now);
  const [y, m] = base.split('-').map(Number);
  picker = { k, y, m };
  renderPicker();
  (document.querySelector('.cal-day[aria-pressed="true"]') || document.querySelector('.cal-day.today:not(:disabled)') || document.querySelector('.cal-day:not(:disabled)'))?.focus();
}
function closePicker(refocus) {
  const k = picker?.k;
  picker = null; renderPicker();
  if (refocus && k) document.getElementById('cal-btn-' + k)?.focus();
}
function renderPicker() {
  for (const k of ['from', 'to']) {
    const slot = document.getElementById('cal-' + k);
    const btn = document.getElementById('cal-btn-' + k);
    if (!slot) continue;
    btn.setAttribute('aria-expanded', picker?.k === k);
    if (picker?.k !== k) { slot.innerHTML = ''; continue; }
    const { y, m } = picker;
    const { lo, hi } = pickerLimits(k);
    const first = new Date(Date.UTC(y, m - 1, 1)).getUTCDay();
    const count = new Date(Date.UTC(y, m, 0)).getUTCDate();
    const today = isoOf(S.now);
    const nowBE = Number(today.slice(0, 4)) + 543;
    const f = S.form;
    let cells = TH_WEEKDAYS.map(w => `<span class="wd" aria-hidden="true">${w}</span>`).join('');
    for (let i = 0; i < first; i++) cells += '<span></span>';
    for (let d = 1; d <= count; d++) {
      const iso = `${y}-${String(m).padStart(2, '0')}-${String(d).padStart(2, '0')}`;
      const off = iso < lo || iso > hi;
      const sel = iso === f[k];
      const inr = f.from && f.to && iso > f.from && iso < f.to;
      cells += `<button type="button" class="cal-day ${iso === today ? 'today' : ''} ${inr ? 'inrange' : ''}" data-act="cal-pick" data-iso="${iso}" aria-pressed="${sel}" aria-label="${d} ${TH_MONTHS_LONG[m - 1]} ${y + 543}" ${off ? 'disabled' : ''}>${d}</button>`;
    }
    const years = [];
    for (let by = nowBE - 10; by <= nowBE + 1; by++) years.push(by);
    slot.innerHTML = `<div class="cal ${k === 'to' ? 'right' : ''}" role="dialog" aria-label="ปฏิทิน ปี พ.ศ.">
      <div class="cal-head">
        <button type="button" class="cal-nav" data-act="cal-step" data-step="-1" aria-label="เดือนก่อนหน้า">‹</button>
        <select data-cal="m" aria-label="เดือน">${TH_MONTHS_LONG.map((n, i) => `<option value="${i + 1}" ${i + 1 === m ? 'selected' : ''}>${n}</option>`).join('')}</select>
        <select data-cal="y" aria-label="ปี พ.ศ.">${years.map(by => `<option value="${by - 543}" ${by - 543 === y ? 'selected' : ''}>${by}</option>`).join('')}</select>
        <button type="button" class="cal-nav" data-act="cal-step" data-step="1" aria-label="เดือนถัดไป">›</button>
      </div>
      <div class="cal-grid">${cells}</div>
      <div class="cal-foot"><span>${k === 'to' && f.from ? 'เลือกได้ไม่เกิน 365 วันนับจากวันแรก' : 'ปี พ.ศ.'}</span>${today >= lo && today <= hi ? `<button type="button" class="link plain" data-act="cal-pick" data-iso="${today}">วันนี้</button>` : ''}</div>
    </div>`;
  }
}

/* ═════════════════ Render root ═════════════════ */

function render(focusId) {
  const active = document.activeElement?.id;
  const rt = route();
  const app = document.getElementById('app');
  if (rt.name === 'public') app.innerHTML = renderPublic();
  else if (rt.name === 'collect') app.innerHTML = renderCollect(rt.token);
  else if (rt.name === 'expired') app.innerHTML = renderExpired();
  else if (rt.name === 'mail') app.innerHTML = renderMail();
  else app.innerHTML = renderReviewer();
  refreshForm();
  renderPicker();
  renderProto();
  renderDialog();
  renderToast();
  const f = document.getElementById(focusId || active);
  if (f && f !== document.activeElement) f.focus({ preventScroll: !focusId });
  save();
}

/* ═════════════════ Events ═════════════════ */

document.addEventListener('input', e => {
  const dk = e.target.dataset?.date;
  if (dk) {
    S.formUi.raw = { ...(S.formUi.raw || {}), [dk]: e.target.value };
    S.form[dk] = parseThaiDate(e.target.value) || '';
    refreshForm(); save();
    return;
  }
  const k = e.target.dataset?.field;
  if (k) {
    S.form[k] = e.target.type === 'checkbox' ? e.target.checked : e.target.value;
    if (k === 'provinceId' || k === 'groupId') return;
    refreshForm(); save();
    return;
  }
  if (e.target.id === 'dlg-note') { dlg.note = e.target.value; }
  if (e.target.id === 'lk') { S.rv.lookupQ = e.target.value; }
});
document.addEventListener('change', e => {
  const c = e.target.dataset?.cal;
  if (c && picker) { picker[c] = Number(e.target.value); renderPicker(); document.querySelector(`[data-cal="${c}"]`)?.focus(); return; }
  const k = e.target.dataset?.field;
  if (k === 'provinceId' || k === 'groupId') { S.form[k] = e.target.value; render(e.target.id); }
  else if (k) { S.form[k] = e.target.type === 'checkbox' ? e.target.checked : e.target.value; refreshForm(); save(); }
});

document.addEventListener('submit', e => {
  e.preventDefault();
  if (e.target.id === 'req-form') {
    S.formUi.attempted = true;
    const ok = checks(S.form).every(c => c.ok);
    if (!ok) { refreshForm(); document.getElementById('checklist').focus(); return; }
    S.formUi.attempted = false;
    S.pubRoute = 'check'; sendFailed = false;
    render('chk-h'); window.scrollTo(0, 0);
  }
  if (e.target.id === 'signin') {
    const user = document.getElementById('si-user').value.trim();
    const pass = document.getElementById('si-pass').value;
    const code = document.getElementById('si-code').value.trim();
    S.rv.lastUser = user;
    signingIn = true; render();
    setTimeout(() => {
      signingIn = false;
      if (!REVIEWERS[user] || !pass || !/^\d{6}$/.test(code) || code === '000000') { signInFailed = true; render('si-pass'); return; }
      signInFailed = false;
      S.rv.user = REVIEWERS[user];
      const back = S.rv.notice?.ref;
      S.rv.notice = null; S.rv.decided = {}; S.rv.lookup = null;
      takeSnapshot();
      if (back && S.requests[back] && zoneOf(S.requests[back])) { S.rv.zone = zoneOf(S.requests[back]); S.rv.sel = back; }
      render('dos-name');
    }, 700);
  }
  if (e.target.id === 'lookup') {
    const q = S.rv.lookupQ.trim().toUpperCase();
    const r = S.requests[q];
    S.rv.lookupErr = '';
    if (!r) { S.rv.lookupErr = 'ไม่พบคำขอเลขนี้ ตรวจสอบเลขที่คำขออีกครั้ง'; render('lk'); return; }
    if (isTerminal(r)) { S.rv.lookup = r.ref; }
    else {
      S.rv.lookup = null;
      const z = ['pending', 'alerts', 'inflight'].find(k => S.rv.snap[k].includes(r.ref)) || zoneOf(r);
      if (!S.rv.snap[z].includes(r.ref)) moveInSnap(r.ref, z);
      S.rv.zone = z; S.rv.sel = r.ref;
    }
    render('dos-name');
  }
});

document.addEventListener('click', e => {
  if (picker && !e.target.closest('.datebox')) closePicker(false);
  const t = e.target.closest('[data-act],[data-go]');
  if (!t) {
    const tip = document.getElementById('tip');
    if (tip && !e.target.closest('#tip')) tip.classList.remove('open');
    return;
  }
  if (t.dataset.go !== undefined) { e.preventDefault(); if (t.dataset.go === '') S.pubRoute = S.pubRoute === 'check' ? 'check' : 'form'; go(t.dataset.go); return; }
  if (t.getAttribute('aria-disabled') === 'true') { e.preventDefault(); return; }
  const a = t.dataset.act;
  const rv = S.rv;
  const r = S.requests[t.dataset.ref];
  switch (a) {
    // chrome
    case 'sim-toggle': simOpen = !simOpen; renderProto(); break;
    case 'tick': tick(Number(t.dataset.min)); flash(`Clock advanced ${Number(t.dataset.min) / 60} h.`); render(); break;
    case 'jobs': {
      const ok = t.dataset.ok === '1';
      const list = reqs().filter(x => x.state === 'approved' && ['queued', 'running'].includes(curRun(x)?.state));
      if (list.length) tick(3);
      list.forEach(x => finishRun(x, ok));
      flash(list.length ? `${list.length} job(s) ${ok ? 'finished: Delivery emails sent' : 'failed: Alerts raised'}.` : 'No extraction job is running.');
      render(); break;
    }
    case 'probes': {
      const ok = t.dataset.ok === '1';
      const list = reqs().filter(x => x.probe.state === 'counting');
      list.forEach(x => resolveProbe(x.ref, ok));
      flash(list.length ? `${list.length} Probe(s) ${ok ? 'counted' : 'failed'}.` : 'No Probe is counting.');
      render(); break;
    }
    case 'flag': S.flags[t.dataset.flag] = !S.flags[t.dataset.flag]; renderProto(); save(); break;
    case 'expire-open': {
      const x = S.requests[rv.sel];
      if (!rv.user || !x || x.state !== 'pending') { flash('Sign in as a Reviewer and open a pending Request first.'); break; }
      tick(0); x.bizMin = 0; x.state = 'lapsed'; log(x, 'ระบบ', 'ครบ 24 ชั่วโมงทำการโดยไม่มีการตัดสิน คำขอสิ้นสุด');
      flash(`${x.ref} ran out of time on the server. The Reviewer's screen still shows it; press approve to see 11e.`); render(); break;
    }
    case 'toast': if (!rv.user) { flash('Sign in as a Reviewer first.'); break; } rv.toast = t.dataset.kind; if (route().name !== 'reviewer') go('reviewer'); else render(); if (t.dataset.kind === 'ceiling') setTimeout(() => { if (rv.toast === 'ceiling') { rv.toast = null; render(); } }, 9000); break;
    case 'prefill': Object.assign(S.form, { groupId: 'heat', from: '2026-03-01', to: '2026-05-31', areaMode: 'region', region: 4, provinceId: '', name: 'สุภาพร', surname: 'วงศ์ใหญ่', workplace: 'สคร.4 สระบุรี กลุ่มระบาดวิทยา', tel: '081 234 5678', email: 'supaporn.w@ddc.mail.go.th', consent: true }); S.pubRoute = 'form'; S.formUi.attempted = false; S.formUi.raw = {}; go(''); break;
    case 'reset': if (confirm('Reset every Request, email and setting in this prototype?')) { try { localStorage.removeItem(KEY); } catch {} S = seed(); dlg.kind = null; simOpen = false; go(''); } break;

    // requester
    case 'area-mode': S.form.areaMode = t.dataset.mode; if (t.dataset.mode !== 'region') S.form.region = null; render(t.dataset.mode === 'province' ? 'f-prov' : t.id); break;
    case 'pick-region': S.form.areaMode = 'region'; S.form.region = Number(t.dataset.region); S.form.provinceId = ''; render('cell-' + t.dataset.region); break;
    case 'tip': document.getElementById('tip').classList.toggle('open'); break;
    case 'cal-open': if (picker?.k === t.dataset.k) closePicker(true); else openPicker(t.dataset.k); break;
    case 'cal-step': { let { y, m } = picker; m += Number(t.dataset.step); if (m < 1) { m = 12; y--; } if (m > 12) { m = 1; y++; } picker.y = y; picker.m = m; renderPicker(); document.querySelector(`[data-act="cal-step"][data-step="${t.dataset.step}"]`)?.focus(); break; }
    case 'cal-pick': {
      const k = picker.k;
      S.form[k] = t.dataset.iso;
      S.formUi.raw = { ...(S.formUi.raw || {}), [k]: '' };
      document.getElementById('f-' + k).value = dShort(isoDay(t.dataset.iso));
      closePicker(true); refreshForm(); save();
      break;
    }
    case 'clear-email': S.form.email = ''; document.getElementById('f-email').value = ''; refreshForm(); document.getElementById('f-email').focus(); save(); break;
    case 'clear-form': S.form = blankForm(); S.formUi.attempted = false; S.formUi.raw = {}; render(); break;
    case 'jump': { const el = document.getElementById(t.dataset.to); if (el) { el.focus(); el.scrollIntoView({ block: 'center' }); } break; }
    case 'pdpa': e.preventDefault(); flash('The PDPA notice link target is not settled (system.md, Consent block).'); break;
    case 'check-back': S.pubRoute = 'form'; render('f-group'); window.scrollTo(0, 0); break;
    case 'check-send':
      if (sending) break;
      sending = true; sendFailed = false; render();
      setTimeout(() => {
        sending = false;
        if (S.flags.sendFail) { S.flags.sendFail = false; sendFailed = true; render(); return; }
        tick(1);
        const res = submitRequest(S.form);
        if (res.dup) { S.pubRoute = 'duplicate'; render('dup-h'); }
        else { S.lastRef = res.ref; S.pubRoute = 'submitted'; render('ok-h'); flash(`${res.ref} stored. Reviewers were emailed; refresh the Reviewer queue to see it.`); }
        window.scrollTo(0, 0);
      }, 900);
      break;
    case 'dup-back': S.pubRoute = 'form'; render('f-group'); break;
    case 'download': {
      e.preventDefault();
      const st = tokenState(t.dataset.token);
      if (!st.ok) { render(); break; }
      st.run.attempts++;
      log(st.r, 'ผู้ถือลิงก์', `ดาวน์โหลดครั้งที่ ${st.run.attempts}`);
      const lapse = st.r.alerts.find(x => x.open && x.kind === 'lapse');
      if (lapse) { lapse.open = false; lapse.outcome = 'ดาวน์โหลดแล้ว'; lapse.clearedBy = 'ระบบ'; lapse.clearedAt = S.now; }
      flash(`Attempt ${st.run.attempts} of ${MAX_ATTEMPTS} counted. No real archive is served in the prototype.${lapse ? ' The collection lapse cleared itself (actor: system).' : ''}`);
      render(); break;
    }

    // mail
    case 'mail-tab': S.mailTab = t.dataset.tab; S.mailSel = null; render(); break;
    case 'mail-open': S.mailSel = Number(t.dataset.id); render(); break;

    // reviewer
    case 'sign-out': rv.user = null; rv.snap = null; rv.toast = null; rv.lookup = null; rv.decided = {}; dlg.kind = null; render('si-user'); break;
    case 'zone': rv.zone = t.dataset.zone; rv.lookup = null; rv.sel = t.dataset.sel || null; rv.lookupErr = ''; render('tab-' + rv.zone); break;
    case 'select': rv.sel = t.dataset.ref; rv.lookup = null; render('dos-name'); break;
    case 'codes': rv.codesOpen[r.ref] = !rv.codesOpen[r.ref]; render(t.id); break;
    case 'refresh':
      if (S.flags.refreshFail) { S.flags.refreshFail = false; rv.refreshErr = true; render(); break; }
      rv.refreshErr = null; rv.decided = {}; takeSnapshot(); render(); break;
    case 'still-here': rv.toast = null; render(); break;
    case 'open-approve': case 'open-reject':
      dlg.kind = a === 'open-approve' ? 'approve' : 'reject'; dlg.ref = r.ref; dlg.note = ''; dlg.err = ''; dlg.trigger = t;
      renderDialog(); document.getElementById(dlg.kind === 'approve' ? 'dlg-confirm' : 'dlg-note').focus(); break;
    case 'dlg-back': closeDialog(); break;
    case 'confirm-approve': case 'confirm-reject': {
      if (dialogBusy) break;
      const x = S.requests[dlg.ref];
      if (a === 'confirm-reject' && dlg.note.trim().length < 10) { dlg.err = 'บันทึกภายในต้องมีอย่างน้อย 10 ตัวอักษร'; renderDialog(); document.getElementById('dlg-note').focus(); break; }
      dialogBusy = true; renderDialog();
      setTimeout(() => {
        dialogBusy = false;
        if (S.flags.sessionExpired) {
          S.flags.sessionExpired = false;
          rv.notice = { ref: x.ref }; rv.user = null; rv.snap = null; rv.toast = null; dlg.kind = null;
          render('si-user'); return;
        }
        dlg.kind = null;
        tick(2);
        if (x.state === 'lapsed') { rv.decided[x.ref] = 'expired'; render('dos-name'); return; }
        if (x.state !== 'pending') { rv.decided[x.ref] = 'taken'; render('dos-name'); return; }
        if (a === 'confirm-approve') {
          x.state = 'approved';
          x.decision = { kind: 'approved', by: rv.user, at: S.now, rows: x.probe.rows };
          log(x, rv.user, 'อนุมัติ');
          startRun(x, rv.user);
          moveInSnap(x.ref, 'inflight');
          rv.decided[x.ref] = 'approved';
        } else {
          x.state = 'rejected';
          x.decision = { kind: 'rejected', by: rv.user, at: S.now, rows: x.probe.rows, note: dlg.note.trim() };
          log(x, rv.user, 'ไม่อนุมัติ');
          log(x, 'ระบบ', 'ส่งอีเมลแจ้งผลแล้ว');
          mail(S, { audience: 'requester', kind: 'rejection', ref: x.ref });
          moveInSnap(x.ref, null);
          rv.decided[x.ref] = 'rejected';
        }
        rv.sel = x.ref;
        render('dos-name');
      }, 900);
      break;
    }
    case 'outcome': {
      const al = r.alerts.find(x => x.open);
      al.open = false; al.outcome = t.dataset.out; al.clearedBy = rv.user; al.clearedAt = S.now;
      log(r, rv.user, `ปิดเรื่อง${alertTitle(al)}: ${t.dataset.out}`);
      if (t.dataset.out === 'ยุติเรื่อง') { r.state = 'ended'; log(r, 'ระบบ', 'คำขอสิ้นสุด'); }
      moveInSnap(r.ref, zoneOf(r));
      flash(`Alert cleared as “${t.dataset.out}”.${zoneOf(r) === 'inflight' ? ' The Request is back under กำลังดำเนินการ.' : ''}`);
      rv.sel = null; render(); break;
    }
    case 'resend': {
      const run = curRun(r);
      mail(S, { audience: 'requester', kind: 'delivery', ref: r.ref, token: run.token });
      log(r, rv.user, 'ส่งอีเมลซ้ำ ลิงก์เดิม');
      rv.actionNote = { ...(rv.actionNote || {}), [r.ref]: `ส่งอีเมลซ้ำแล้ว เวลา ${hm(S.now)} ลิงก์เดิม ไม่ได้ต่ออายุ` };
      render(); break;
    }
    case 'rerun': {
      startRun(r, rv.user);
      rv.actionNote = { ...(rv.actionNote || {}), [r.ref]: `เริ่มดึงข้อมูลใหม่ ครั้งที่ ${curRun(r).n} เวลา ${hm(S.now)}` };
      flash('Re-run queued. Use Simulate → Finish or Fail running jobs.');
      render(); break;
    }
  }
});

function closeDialog() {
  if (dialogBusy) return;
  const trig = dlg.trigger;
  dlg.kind = null; renderDialog();
  trig?.isConnected ? trig.focus() : document.querySelector('[data-act="open-approve"]')?.focus();
}

document.addEventListener('keydown', e => {
  // Dialog: Escape returns to the trigger; Tab stays inside.
  if (dlg.kind) {
    if (e.key === 'Escape') { e.preventDefault(); closeDialog(); return; }
    if (e.key === 'Tab') {
      const items = [...document.querySelectorAll('.dialog button:not([disabled]), .dialog textarea')];
      const i = items.indexOf(document.activeElement);
      if (e.shiftKey && i <= 0) { e.preventDefault(); items[items.length - 1].focus(); }
      else if (!e.shiftKey && i === items.length - 1) { e.preventDefault(); items[0].focus(); }
    }
    return;
  }
  if (picker && e.key === 'Escape') { e.preventDefault(); closePicker(true); return; }
  if (picker && e.target.classList.contains('cal-day') && ['ArrowLeft', 'ArrowRight', 'ArrowUp', 'ArrowDown'].includes(e.key)) {
    e.preventDefault();
    const n = { ArrowLeft: -1, ArrowRight: 1, ArrowUp: -7, ArrowDown: 7 }[e.key];
    const days = [...document.querySelectorAll('.cal-day[data-iso]')].filter(b => b.closest('.cal-grid'));
    const i = days.indexOf(e.target);
    let j = i + n;
    while (days[j] && days[j].disabled) j += Math.sign(n);
    days[j]?.focus();
    return;
  }
  if (e.key === 'Escape') { document.getElementById('tip')?.classList.remove('open'); if (simOpen) { simOpen = false; renderProto(); } }
  const t = e.target;
  const arrows = { ArrowRight: 1, ArrowDown: 1, ArrowLeft: -1, ArrowUp: -1 };
  if (!(e.key in arrows)) return;
  const step = arrows[e.key];
  if (t.classList.contains('cell')) {
    e.preventDefault();
    const n = ((Number(t.dataset.region) - 1 + step + 13) % 13) + 1;
    S.form.areaMode = 'region'; S.form.region = n; S.form.provinceId = ''; render('cell-' + n);
  } else if (t.classList.contains('seg')) {
    e.preventDefault();
    const mode = t.dataset.mode === 'national' ? 'province' : 'national';
    S.form.areaMode = mode; S.form.region = null; render(document.querySelector(`[data-mode="${mode}"]`).id || undefined);
    document.querySelector(`.seg[data-mode="${mode}"]`)?.focus();
  } else if (t.classList.contains('tab')) {
    e.preventDefault();
    const order = ['pending', 'alerts', 'inflight'];
    const z = order[(order.indexOf(t.dataset.zone) + step + 3) % 3];
    S.rv.zone = z; S.rv.sel = null; S.rv.lookup = null; render('tab-' + z);
  }
});

// Email tooltip opens on hover and on focus, stays while hovered (WCAG 1.4.13).
document.addEventListener('mouseover', e => { const w = e.target.closest?.('#tip'); if (w) w.classList.add('open'); });
document.addEventListener('mouseout', e => { const w = e.target.closest?.('#tip'); if (w && !w.contains(e.relatedTarget) && document.activeElement?.dataset.act !== 'tip') w.classList.remove('open'); });
// Whatever form a date was typed in, it is read back at rest as 1 มี.ค. 2569.
document.addEventListener('focusout', e => { const k = e.target.dataset?.date; if (k && S.form[k]) e.target.value = dShort(isoDay(S.form[k])); });
document.addEventListener('focusin', e => { if (e.target.dataset?.act === 'tip') e.target.closest('#tip').classList.add('open'); });
document.addEventListener('focusout', e => { if (e.target.dataset?.act === 'tip') e.target.closest('#tip').classList.remove('open'); });

window.addEventListener('hashchange', () => { render(); window.scrollTo(0, 0); });
render();
</script>
