# The Pilot (ADR 0022, #101), on top of the production-shaped docker-compose.yml:
#   deploy/pilot/compose.sh <compose command>
# which runs
#   docker compose --project-name dds-pilot --env-file ~/dds-pilot/.env \
#     -f docker-compose.yml -f compose.pilot.yml <compose command>
#
# Differences from the base file, and nothing else:
# - the app runs the image `deploy/pilot/pipeline.sh build` made, never a build
#   of its own, so what runs is always a tagged commit of `pilot`;
# - the app publishes no public port: cloudflared reaches it by service name on
#   the Compose network, so the tunnel is the only way in (#101);
# - references are the Pilot's own (spec §12.5, #100);
# - everything restarts with the host.
# `docker compose down` stops the tunnel with the rest: it is the kill switch.
services:
  app:
    build: !reset null
    image: dds-sharing-pilot:latest
    pull_policy: never
    ports: !override
      # Bull Board (spec §14.4): the host's loopback only, as in the base file.
      # Reach it with `ssh -L 3100:127.0.0.1:3100 personal-test-server`.
      - '127.0.0.1:3100:3100'
    environment:
      # Fixed here, not in .env: on the Pilot a missing value would reissue
      # Production's numbers (ADR 0022).
      REFERENCE_PREFIX: PLT
    restart: unless-stopped

  postgres:
    restart: unless-stopped

  redis:
    restart: unless-stopped

  minio:
    restart: unless-stopped

  # A remotely-managed tunnel: its public hostname is set in the Cloudflare
  # dashboard to `http://app:3000`, and the one secret is the token in .env.
  cloudflared:
    image: cloudflare/cloudflared:latest
    command: tunnel --no-autoupdate run
    environment:
      TUNNEL_TOKEN: ${TUNNEL_TOKEN:?}
    depends_on:
      - app
    restart: unless-stopped
