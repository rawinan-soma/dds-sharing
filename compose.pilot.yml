# The Pilot (ADR 0022, #101), on top of the production-shaped docker-compose.yml.
# On the server in ~/dds-pilot, beside its .env; deploy/pilot/Makefile copies
# both compose files there and runs
#   docker compose --project-name dds-pilot \
#     --env-file ~/dds-pilot/.env --env-file ~/dds-pilot/release.env \
#     -f ~/dds-pilot/docker-compose.yml -f ~/dds-pilot/compose.pilot.yml <command>
#
# Differences from the base file, and nothing else:
# - the app runs the image `make build` pushed, at the commit
#   release.env names — never a build, since the server has no source;
# - the app publishes no public port: cloudflared reaches it by service name on
#   the Compose network, so the tunnel is the only way in (#101);
# - references are the Pilot's own (spec §12.5, #100);
# - MinIO is Pigsty's maintained fork, since minio/minio can no longer be pulled;
# - everything restarts with the host.
# `docker compose down` stops the tunnel with the rest: it is the kill switch.
services:
  app:
    build: !reset null
    image: rawinan/dds-sharing-pilot:${PILOT_TAG:?}
    ports: !override
      # Bull Board (spec §14.4): the host's loopback only, as in the base file.
      # Reach it with `ssh -L 3100:127.0.0.1:3100 personal-test-server`.
      - '127.0.0.1:3100:3100'
    environment:
      # Fixed here, not in .env: on the Pilot a missing value would reissue
      # Production's numbers (ADR 0022).
      REFERENCE_PREFIX: PLT
    restart: unless-stopped

  postgres:
    restart: unless-stopped

  redis:
    restart: unless-stopped

  minio:
    # minio/minio is no longer published, and the base file's only works where
    # it is already cached. Pigsty's fork keeps MinIO's env, data format and
    # `server` command, needs no login, and is pinned to a dated release
    # (docs/research/004-object-storage-image.md).
    image: pgsty/silo:RELEASE.2026-09-16T00-00-00Z
    restart: unless-stopped

  # A remotely-managed tunnel: its public hostname is set in the Cloudflare
  # dashboard to `http://app:3000`, and the one secret is the token in .env.
  cloudflared:
    image: cloudflare/cloudflared:latest
    command: tunnel --no-autoupdate run
    environment:
      TUNNEL_TOKEN: ${TUNNEL_TOKEN:?}
    depends_on:
      - app
    restart: unless-stopped
