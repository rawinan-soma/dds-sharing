services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: dds_sharing
      POSTGRES_PASSWORD: dds_sharing
      POSTGRES_DB: dds_sharing
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dds_sharing"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    image: minio/minio:latest
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: dds_sharing
      MINIO_ROOT_PASSWORD: dds_sharing
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 10

  mailpit:
    image: axllent/mailpit:latest
    ports:
      - "8025:8025"
      - "1025:1025"

  app:
    build: .
    ports:
      - "3000:3000"
    environment:
      PORT: "3000"
      BASE_URL: "http://localhost:3000"
      DATABASE_URL: "postgres://dds_sharing:dds_sharing@postgres:5432/dds_sharing"
      DISK_CHECK_PATH: "/data"
    volumes:
      - app_data:/data
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
      mailpit:
        condition: service_started

volumes:
  postgres_data:
  redis_data:
  minio_data:
  app_data:
