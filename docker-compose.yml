services:
  app:
    build: .
    ports:
      - "3000:3000"
    # A bare name passes the variable through from the host/`.env` (never a
    # baked-in value here — ADR 0018). Compose does not enforce "required"
    # across an overlay file (a later file's literal value cannot satisfy an
    # earlier file's `${VAR:?}`, since interpolation reads only the
    # shell/`.env` pool, never another file's config) — the app's own boot
    # validation is the single enforcer, and it is what actually "refuses to
    # start, naming the unset variables" for `docker compose up` run here
    # alone, without compose.dev.yml and without a `.env`.
    environment:
      - PORT
      - DATABASE_URL
      - APP_DATABASE_URL
      - REDIS_URL
      - MINIO_ENDPOINT
      - MINIO_PORT
      - MINIO_USE_SSL
      - MINIO_ACCESS_KEY
      - MINIO_SECRET_KEY
      - MINIO_BUCKET
      - SMTP_HOST
      - SMTP_PORT
      - SMTP_STARTTLS
      - SMTP_SECURE
      - SMTP_USER
      - SMTP_PASS
      - SMTP_FROM
      - SMTP_ALLOW_PLAINTEXT
      - UPSTREAM_TOKEN
      - UPSTREAM_BASE_URL
      - FRONTEND_URL
      - ALLOW_INSECURE_TRANSPORT
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
      minio:
        condition: service_started

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: dds_sharing
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 2s
      timeout: 5s
      retries: 15

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data

volumes:
  postgres-data:
  minio-data:
